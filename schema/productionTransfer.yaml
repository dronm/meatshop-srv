  table:
    schema: public
    name: production_transfers_list
  fields:
    - name: id
      type: int
      primaryKey: true
    - name: version
      type: bigint
    - name: document_date
      type: date
    - name: for_date
      type: date
    - name: comment
      type: text
      nullable: true
    - name: product_totals
      type: text
    - name: customers
      type: text
crud:
  create: true
  list: true
  detail: true
  update: true
  delete: true
service:
  manualMethods: [create, detail, update, delete]
