name: ProductionTransfer
comment: Production handover document header; order contents are read live.
humanName: production transfer
humanNamePlural: production transfers
table:
  schema: public
  name: production_transfers
route: /production-transfers
permissionPrefix: productionTransfer
serviceName: ProductionTransfer
sessionRequired: true
crudNotifications: true
keys:
  - name: id
    pathName: id
    type: int
fields:
  - name: id
    type: int
    primaryKey: true
    autoIncrement: true
    serverGenerated: true
  - name: version
    type: bigint
    required: true
    serverGenerated: true
    default: "1"
  - name: document_date
    type: date
    required: true
  - name: for_date
    type: date
    required: true
  - name: comment
    type: text
    nullable: true
